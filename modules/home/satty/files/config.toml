[general]
fullscreen = false
early-exit = true
corner-roundness = 0
initial-tool = "brush"
copy-command = "wl-copy"
annotation-size-factor = 1
# Saved paths support strftime fields and a leading ~.
output-filename = "~/Pictures/satty/satty-%Y%m%d-%H%M%S.png"
save-after-copy = false
default-hide-toolbars = false
focus-toggles-toolbars = false
default-fill-shapes = false
primary-highlighter = "block"
disable-notifications = false
# Actions run in list order.
actions-on-right-click = []
actions-on-enter = []
actions-on-escape = ["exit"]
no-window-decoration = true

[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"

[font]
family = "Unifont"
style = "Regular"

[color-palette]
palette = [
    "#00ffff",
    "#a52a2a",
    "#dc143c",
    "#ff1493",
    "#ffd700",
    "#008000",
]

# Color picker presets; an empty list uses GTK defaults.
custom = [
    "#00ffff",
    "#a52a2a",
    "#dc143c",
    "#ff1493",
    "#ffd700",
    "#008000",
]
