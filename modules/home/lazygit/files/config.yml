git:
  autoFetch: false
  diffRenderers:
    - command: diff-so-fancy
gui:
  nerdFontsVersion: '3'
  theme:
    activeBorderColor:
      - '#FFC66D'
      - bold
    inactiveBorderColor:
      - '#7C7C7C'
    defaultFgColor:
      - '#ADAEAC'
    selectedLineBgColor:
      - '#262626'
    optionsTextColor:
      - '#CC85C6'
    searchingActiveBorderColor:
      - '#E6E6AA'
    unstagedChangesColor:
      - '#F44747'
    cherryPickedCommitBgColor:
      - '#262626'
    cherryPickedCommitFgColor:
      - '#47CCB1'
    authorColors:
      '*': '#b4befe'
os:
  editPreset: "nvim-remote"
keybinding:
  files:
    commitChanges: <disabled>
    commitChangesWithEditor: c
customCommands:
  - key: "C"
    context: "files"
    description: "Generate commit message with AI"
    command: "git-ai-commit"
    output: terminal
