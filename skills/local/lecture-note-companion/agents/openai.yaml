interface:
  display_name: "Lecture Note Companion"
  short_description: "Build lecture notes with focused visuals and a separate transcript"
  default_prompt: "Use $lecture-note-companion to follow this lecture step by step, distinguish mainline chunks from side questions, plan one or more simple focused visuals for each mainline chunk, and finish with a structured illustrated note plus a separate cleaned full-transcript resource."
policy:
  allow_implicit_invocation: true
