# font=Maple Mono NF:size=16, Maple Mono NL NF CN:size=16
font=IBM Plex Mono:size=16, Symbols Nerd Font Mono:size=16
# font=Noto Sans Mono:size=16
bold-text-in-bright=yes

[colors]
alpha=0.8

foreground=ffffff
background=000000

cursor=171616 adaeac

# --- ANSI 8 colors ---

regular0=171616   # black (background)
regular1=f44747   # red (error)
regular2=6a9955   # green (comment)
regular3=e6e6aa   # yellow (function)
regular4=47a2ed   # blue (keyword)
regular5=cc85c6   # magenta (secondary keyword)
regular6=47ccb1   # cyan (class)
regular7=adaeac   # white (default text)

# --- bright variants ---

bright0=262626
bright1=ff6b6b
bright2=b4cda8
bright3=d7ba7d
bright4=94dbfd
bright5=e49ad8
bright6=5fe0c6
bright7=ffffff

# --- extended colors ---
16=cd9069      # string
17=fab387      # optional accent (tab underline replacement)

selection-foreground=adaeac
selection-background=264e77

search-box-no-match=171616 f44747
search-box-match=adaeac 262626

jump-labels=171616 e6e6aa
urls=47a2ed

[cursor]
style=beam

[desktop-notifications]
command=notify-send --wait --app-name ${app-id} --icon ${app-id} --category ${category} --urgency ${urgency} --expire-time ${expire-time} --hint STRING:image-path:${icon} --hint BOOLEAN:suppress-sound:${muted} --hint STRING:sound-name:${sound-name} --replace-id ${replace-id} ${action-argument} --print-id -- ${title} ${body}

[url]
launch=xdg-open ${url}

[key-bindings]
# scrollback-up-page=Shift+Page_Up Shift+KP_Page_Up
scrollback-up-half-page=Control+u
