format = """
$username\
$hostname\
$directory\
$nix_shell\
$git_branch\
$git_commit\
$git_state\
$git_status\
$git_metrics\
$fill\
$cmd_duration\
$time
$character"""

add_newline = false
palette = "spreadzhao"

[directory]
style = "theme_purple"

[character]
success_symbol = "[❯](theme_yellow)"
error_symbol = "[X](theme_red)"
vimcmd_symbol = "[](theme_white)"

[git_branch]
format = "[$branch]($style)"
style = "theme_cyan"

[git_state]
format = '\([$state($progress_current/$progress_total)]($style)\)'
style = "theme_cyan"

[git_status]
format = '([$all_status$ahead_behind]($style))'
modified = 'M'
conflicted = '󱃞'
style = "theme_bright_yellow"

[git_metrics]
format = '([+$added]($added_style))([-$deleted]($deleted_style))'
disabled = false
added_style = "bold theme_blue"
deleted_style = "bold theme_red"

[cmd_duration]
format = "[$duration]($style) "
style = "theme_yellow"

[fill]
symbol = '-'
style = 'theme_bright_dark'

[time]
disabled = false
format = '[$time]($style)'
# time_format = '%H:%M:%S%.3f'
time_format = '%H:%M:%S'
style = "bold theme_yellow"

[nix_shell]
disabled = false
impure_msg = ''
style= 'theme_bright_blue'
symbol = ''
format = '[$symbol$state]($style) '
# BUG: heuristic always returns true (depends on whether any value $PATH starts with /nix/store)
# https://github.com/starship/starship/blob/master/src/modules/nix_shell.rs#L38
# heuristic = true

[shlvl]
disabled = true
style = "theme_bright_blue"
symbol = "󰓍 "

