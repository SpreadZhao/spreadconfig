[border]
radius=8

[colors]
background=0e1117dd
counter=7f849cff
input=dc8a78ff
match=f5e0dcff
placeholder=7f849cff
prompt=dc8a78ff
selection=585b70ff
selection-match=f5e0dcff
selection-text=cdd6f4ff
text=cdd6f4ff

[main]
font=Noto Sans Mono:size=14, Symbols Nerd Font Mono:size=14, Noto Color Emoji:size=14
image-size-ratio=1
show-actions=no
tabs=4
terminal=footclient -a '{cmd}' -T '{cmd}' {cmd}
use-bold=yes
width=50

[key-bindings]
next=none
prev=none
next-with-wrap=Control+n
prev-with-wrap=Control+p
