[main]
title-color=a6adc8ff
summary-color=cdd6f4ff
body-color=cdd6f4ff
background=1e1e2eb3
border-color=89b4faff
progress-bar-color=6c7086ff

max-width=1000
max-height=500
max-icon-size=64
anchor=top-right
stacking-order=bottom-up
selection-helper-uses-null-separator=yes
selection-helper="fuzzel --dmenu0"

title-font=Noto Sans:size=16:weight=semibold,Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans CJK JP,Noto Sans CJK KR,Symbols Nerd Font Mono,Noto Color Emoji
summary-font=Noto Sans:size=12,Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans CJK JP,Noto Sans CJK KR,Symbols Nerd Font Mono,Noto Color Emoji
body-font=Noto Sans:size=10,Noto Sans CJK SC,Noto Sans CJK TC,Noto Sans CJK JP,Noto Sans CJK KR,Symbols Nerd Font Mono,Noto Color Emoji

max-timeout=0
default-timeout=10
idle-timeout=5

[critical]
border-color=fab387ff
